# Seven independent L40 workers after single-GPU verification; GPU 0 has another process.
host = "127.0.0.1"
port = 8765
model = "Qwen/Qwen-Image-2.1-Turbo"
model_source = "modelscope"
revision = "master"
cache_dir = "~/.cache/watermark-models"
gpus = [1, 2, 3, 4, 5, 6, 7]
replicas_per_gpu = 1
load_parallelism = 1
dtype = "bfloat16"
attention = "sdpa"
compile = false
compile_mode = "default"
offload = "none"
vae_tiling = true
vae_slicing = true
kv_cache = true
tf32 = true
cpu_threads = 4
allowed_roots = ["~", "/mnt"]
state_dir = "~/.local/state/watermark-studio"
backend = "qwen"
