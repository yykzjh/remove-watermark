host = "127.0.0.1"
port = 8765
model = "Qwen/Qwen-Image-2.1-Turbo"
model_source = "modelscope"
revision = "master"
cache_dir = "~/.cache/watermark-models"
gpus = [0, 1, 2, 3, 4, 5, 6, 7]
replicas_per_gpu = 1
load_parallelism = 8
dtype = "bfloat16"
attention = "sdpa"
compile = false
compile_mode = "default"
offload = "none"
vae_tiling = false
vae_slicing = false
kv_cache = false
tf32 = false
cpu_threads = 1
allowed_roots = ["~", "/mnt"]
state_dir = "~/.local/state/watermark-studio"
backend = "qwen"
batch_size = 2
batch_window = 4
batch_bucketing = false
oom_split_batch = false

# Advanced options are conservative here. CLI boolean flags are always opt-in.
attention_backend = "native"
compile_scope = "full"
compile_dynamic = false
prompt_encoder = "stock"
encoder_batch_size = 1
fuse_qkv = false
quantization = "none"
vae_tile_size = 256
vae_tile_stride = 192
expandable_segments = false
shape_sort = false
scan_workers = 1
report_interval = 1
