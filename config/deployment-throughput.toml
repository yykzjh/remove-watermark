# Eight independent GPU workers; enable boolean optimizations explicitly in launch script.
host = "127.0.0.1"
port = 8765
model_source = "modelscope"
revision = "master"
cache_dir = "~/.cache/watermark-models"
gpus = [0, 1, 2, 3, 4, 5, 6, 7]
replicas_per_gpu = 1
load_parallelism = 1
attention = "sdpa"
compile = false
compile_mode = "default"
kv_cache = false
vae_tiling = false
vae_slicing = false
cpu_threads = 1
allowed_roots = ["~", "/mnt"]
batch_size = 2
batch_window = 4
batch_bucketing = false
oom_split_batch = false
